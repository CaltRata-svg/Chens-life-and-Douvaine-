    C.h-=ix*1.9*dt*Math.max(-1,Math.min(1,C.v/6));
    const p=car.position,ox=p.x,oz=p.z;p.x+=Math.sin(C.h)*C.v*dt;p.z+=Math.cos(C.h)*C.v*dt;
    const hit=move(p,ox,oz,1.8);if(hit||Math.hypot(p.x-ox,p.z-oz)<Math.abs(C.v)*dt*.5)C.v*=.6;
    car.rotation.y=C.h;wheels.forEach(w=>w.rotation.x+=C.v*dt*2.5);tgt=p;
    let d=(C.h+Math.PI)-camYaw;d=Math.atan2(Math.sin(d),Math.cos(d));camYaw+=d*Math.min(1,dt*3);
  }
  const dist=mode==='foot'?6:10,hgt=mode==='foot'?3:4.2;
  cam.position.set(tgt.x+Math.sin(camYaw)*dist,hgt,tgt.z+Math.cos(camYaw)*dist);cam.lookAt(tgt.x,mode==='foot'?1.4:1.2,tgt.z);
  btn.style.display=(mode==='car'||near())?'block':'none';ren.render(scene,cam)}
// ---- Teleport map ----
const mapBtn=document.getElementById('mapBtn'),mp=document.getElementById('mp'),mc=document.getElementById('mc'),mt=document.getElementById('mt'),g2=mc.getContext('2d');
const MW=BB[2]-BB[0],MH=BB[3]-BB[1],MSC=900/Math.max(MW,MH);mc.width=Math.round(MW*MSC);mc.height=Math.round(MH*MSC);
let mapImg=null;
function buildMap(){const c=document.createElement('canvas');c.width=mc.width;c.height=mc.height;const g=c.getContext('2d');
  g.fillStyle='#86b568';g.fillRect(0,0,c.width,c.height);
  const poly=(pts,fill)=>{g.beginPath();for(let i=0;i<pts.length;i+=2){const X=(pts[i]-BB[0])*MSC,Y=(pts[i+1]-BB[1])*MSC;i?g.lineTo(X,Y):g.moveTo(X,Y)}g.closePath();g.fillStyle=fill;g.fill()};
  for(const [cl,pts] of D.l)poly(pts,cl);poly(D.w,'#2f7fc1');
  g.lineCap='round';for(const [cl,w,pts] of D.r){g.beginPath();for(let i=0;i<pts.length;i+=2){const X=(pts[i]-BB[0])*MSC,Y=(pts[i+1]-BB[1])*MSC;i?g.lineTo(X,Y):g.moveTo(X,Y)}
    g.strokeStyle=cl===0?'#fff':'#e8dcb8';g.lineWidth=Math.max(cl===2?.8:1.2,w*MSC*(cl===0?1:.8));g.stroke()}
  for(const [h,pts] of D.b)poly(pts,'#b5524a');
  g.fillStyle='#173e2a';g.font='bold 15px system-ui,sans-serif';g.textAlign='center';g.fillText('DOUVAINE',(DOUVAINE_CENTER.x-BB[0])*MSC,(DOUVAINE_CENTER.z-BB[1])*MSC);
  g.fillStyle='#fff';g.font='12px system-ui,sans-serif';g.fillText('centre-ville',(DOUVAINE_CENTER.x-BB[0])*MSC,(DOUVAINE_CENTER.z-BB[1])*MSC+15);mapImg=c}
function drawMap(){g2.drawImage(mapImg,0,0);const mark=(p,c)=>{g2.beginPath();g2.arc((p.x-BB[0])*MSC,(p.z-BB[1])*MSC,9,0,7);g2.fillStyle=c;g2.fill();g2.lineWidth=3;g2.strokeStyle='#fff';g2.stroke()};
  mark(car.position,'#e33');mark(man.position,'#27c')}
mapBtn.addEventListener('pointerdown',e=>{e.stopPropagation();if(!mapImg)buildMap();drawMap();mt.textContent='Tap on the map to teleport';mp.style.display='flex'});
document.getElementById('mx').addEventListener('click',()=>mp.style.display='none');
mc.addEventListener('pointerdown',e=>{const r=mc.getBoundingClientRect(),x=BB[0]+(e.clientX-r.left)/r.width*MW,z=BB[1]+(e.clientY-r.top)/r.height*MH;
  const rad=mode==='car'?1.8:.5;if(inLake(x,z)){mt.textContent='That is the lake, tap on land';return}
  const p=mode==='car'?car.position:man.position;p.x=x;p.z=z;pushBuildings(p,rad);if(inLake(p.x,p.z)){mt.textContent='That is the lake, tap on land';return}
  C.v=0;mp.style.display='none'});
requestAnimationFrame(frame);
